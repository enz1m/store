<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Store</title>
  <defs>
    <filter id="enz-store-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="enz-store-awn">
      <path d="M16 32 A6 6 0 0 1 22 26 H106 A6 6 0 0 1 112 32 V46 A8 8 0 0 1 96 46 A8 8 0 0 1 80 46 A8 8 0 0 1 64 46 A8 8 0 0 1 48 46 A8 8 0 0 1 32 46 A8 8 0 0 1 16 46 Z"/>
    </clipPath>
  </defs>

  <!-- square keyline; shop 84 x 64 (22..106 x 44..108); awning 96 x 20 (16..112 x 26..46) with six 16 px stripes
       and six r 8 scallops; window 34 x 26, door 22 x 44 -->
  <g filter="url(#enz-store-drop)">
    <path d="M22 44 H106 V99 A9 9 0 0 1 97 108 H31 A9 9 0 0 1 22 99 Z" fill="#FFFFFF"/>
    <path d="M16 32 A6 6 0 0 1 22 26 H106 A6 6 0 0 1 112 32 V46 A8 8 0 0 1 96 46 A8 8 0 0 1 80 46 A8 8 0 0 1 64 46 A8 8 0 0 1 48 46 A8 8 0 0 1 32 46 A8 8 0 0 1 16 46 Z" fill="#FF6A3D"/>
  </g>
  <g clip-path="url(#enz-store-awn)"><rect x="32" y="20" width="16" height="44" fill="#FFFFFF"/><rect x="64" y="20" width="16" height="44" fill="#FFFFFF"/><rect x="96" y="20" width="16" height="44" fill="#FFFFFF"/></g>
  <rect x="22" y="54" width="84" height="4" fill="#000000" fill-opacity="0.06"/>
  <rect x="32" y="64" width="34" height="26" rx="4" fill="#9ED8F7"/>
  <rect x="74" y="64" width="22" height="44" rx="3" fill="#3B4BD8"/>
  <circle cx="90" cy="88" r="2" fill="#FFFFFF"/>
</svg>
